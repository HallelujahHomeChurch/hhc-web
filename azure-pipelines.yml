trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - azure-pipelines.yml
      - .dockerignore

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: "alive-azure-rm"
  acrName: "alive"
  acrLoginServer: "alive.azurecr.io"
  imageTag: "$(Build.SourceBranchName)-$(Build.BuildId)"
  resourceGroup: "alive"

stages:
  - stage: Verify
    jobs:
      - job: frontend
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
          - script: |
              set -euo pipefail
              corepack enable
              corepack prepare pnpm@10.12.1 --activate
              pnpm install --frozen-lockfile
              pnpm test
              pnpm lint
              pnpm build
            displayName: Test, lint, and build workspace
          - script: |
              set -euo pipefail
              docker build -f apps/web/Dockerfile -t hhc-web:verify .
              docker build -f apps/account/Dockerfile -t account-fe:verify .
              docker build -f apps/admin/Dockerfile -t admin-fe:verify .
            displayName: Build independent app images

  - stage: BuildAndPush
    dependsOn: Verify
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: images
        strategy:
          matrix:
            web:
              imageRepository: "alive/hhc-web"
              dockerfilePath: "apps/web/Dockerfile"
            account:
              imageRepository: "alive/account-fe"
              dockerfilePath: "apps/account/Dockerfile"
            admin:
              imageRepository: "alive/admin-fe"
              dockerfilePath: "apps/admin/Dockerfile"
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(imageRepository):$(imageTag)" \
                  --image "$(imageRepository):latest" \
                  --file "$(Build.SourcesDirectory)/$(dockerfilePath)" \
                  "$(Build.SourcesDirectory)"

  - stage: Deploy
    dependsOn: BuildAndPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: apps
        strategy:
          matrix:
            web:
              imageRepository: "alive/hhc-web"
              containerAppName: "hhc-web"
            account:
              imageRepository: "alive/account-fe"
              containerAppName: "account-fe"
            admin:
              imageRepository: "alive/admin-fe"
              containerAppName: "admin-fe"
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                image_ref="$(acrLoginServer)/$(imageRepository):$(imageTag)"
                env_args=()
                if [[ "$(containerAppName)" == "hhc-web" ]]; then
                  env_args=(--set-env-vars HHC_WEB_API_BASE_URL=https://www.alive.org.tw/api)
                fi
                az containerapp update \
                  --resource-group "$(resourceGroup)" \
                  --name "$(containerAppName)" \
                  --image "${image_ref}" \
                  "${env_args[@]}" \
                  --only-show-errors \
                  --output none

                target_revision="$(az containerapp show --resource-group "$(resourceGroup)" --name "$(containerAppName)" --query properties.latestRevisionName --output tsv)"
                for attempt in {1..30}; do
                  ready_revision="$(az containerapp show --resource-group "$(resourceGroup)" --name "$(containerAppName)" --query properties.latestReadyRevisionName --output tsv)"
                  [[ "${ready_revision}" == "${target_revision}" ]] && exit 0
                  sleep 10
                done
                echo "Revision ${target_revision} did not become ready" >&2
                exit 1
