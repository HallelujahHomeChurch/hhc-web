name: hhc-office

services:
  caddy:
    build:
      context: ./compose/caddy
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      ACME_CA: ${ACME_CA}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID}
      AZURE_RESOURCE_GROUP_NAME: ${AZURE_RESOURCE_GROUP_NAME}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
    ports:
      - "443:443"
    volumes:
      - ./compose/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - office-caddy-data:/data
      - office-caddy-config:/config
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      ACCOUNT_DB_USER: ${ACCOUNT_DB_USER:?set ACCOUNT_DB_USER}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD}
      WEB_DB_USER: ${WEB_DB_USER:?set WEB_DB_USER}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD}
      ASSET_DB_USER: ${ASSET_DB_USER:?set ASSET_DB_USER}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:?set ASSET_DB_PASSWORD}
    volumes:
      - office-postgres:/var/lib/postgresql/data
      - ./compose/postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - office-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  account-migrate:
    build:
      context: ../account/account-api
    command: ["/app/migrate", "-direction=up"]
    environment: &account-api-environment
      PORT: "8080"
      ENVIRONMENT: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: account_db
      DB_USER: ${ACCOUNT_DB_USER:?set ACCOUNT_DB_USER}
      DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_ISSUER: https://account-test.alive.org.tw
      FRONTEND_URL: https://account-test.alive.org.tw
      CORS_ALLOWED_ORIGINS: https://account-test.alive.org.tw,https://admin-test.alive.org.tw,https://www-test.alive.org.tw
      SHARED_COOKIE_DOMAIN: .alive.org.tw
      ASSET_API_URL: http://asset-api:8080
      ASSET_PUBLIC_BASE_URL: https://www-test.alive.org.tw/api/assets
      AVATAR_RECONCILE_INTERVAL: 5s
      NOTIFICATION_API_URL: http://notification-api:8081
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
      ADMIN_INIT_ENABLED: ${ADMIN_INIT_ENABLED:-true}
      REGISTRATION_ENABLED: "false"
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_KEY_ID: ${JWT_KEY_ID}
      CSRF_SECRET: ${CSRF_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  account-api:
    build:
      context: ../account/account-api
    environment: *account-api-environment
    depends_on:
      account-migrate:
        condition: service_completed_successfully
      notification-api:
        condition: service_started
      asset-api:
        condition: service_started
    restart: unless-stopped
    expose: ["8080"]

  notification-api:
    build:
      context: ../account/notification-api
    environment:
      PORT: "8081"
      REDIS_ADDR: redis:6379
      QUEUE_DRIVER: memory
      LOG_EMAIL_BODY: "true"
      INTERNAL_API_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    expose: ["8081"]

  asset-api:
    build:
      context: ../asset-api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${ASSET_DB_USER:?set ASSET_DB_USER}:${ASSET_DB_PASSWORD:?set ASSET_DB_PASSWORD}@postgres:5432/asset?sslmode=disable
      ASSET_PUBLIC_BASE_URL: https://www-test.alive.org.tw/api/assets
      ASSET_STORAGE_BACKEND: local
      ASSET_LOCAL_DIR: /data/assets
      ASSET_LOCAL_UPLOAD_BASE_URL: https://www-test.alive.org.tw/api/assets/uploads
      ASSET_ALLOWED_CALLERS: account-api,hhc-web-api
      ASSET_ALLOW_DEV_CALLER_HEADER: "true"
      ASSET_LOCAL_SIGNING_KEY: ${ASSET_LOCAL_SIGNING_KEY}
      CLAMAV_HOST: ${CLAMAV_HOST}
      CLAMAV_PORT: ${CLAMAV_PORT}
    volumes:
      - office-assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose: ["8080"]

  hhc-web-api:
    build:
      context: ../hhc-web-api
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://${WEB_DB_USER:?set WEB_DB_USER}:${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD}@postgres:5432/hhc_web?sslmode=disable
      REDIS_URL: redis://redis:6379/2
      ENVIRONMENT: production
      ASSET_API_BASE_URL: http://asset-api:8080
      INTERNAL_CALLER_APP_ID: hhc-web-api
      PUBLIC_BASE_URL: https://www-test.alive.org.tw/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asset-api:
        condition: service_started
    restart: unless-stopped
    expose: ["8082"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - source: frontend_npmrc
          target: npmrc
    restart: unless-stopped
    expose: ["10000"]

  account:
    build:
      context: ../account/account-fe
      dockerfile: Dockerfile
      secrets:
        - source: frontend_npmrc
          target: npmrc
    restart: unless-stopped
    expose: ["10000"]

  admin:
    build:
      context: ../account/admin-fe
      dockerfile: Dockerfile
      secrets:
        - source: frontend_npmrc
          target: npmrc
    restart: unless-stopped
    expose: ["10000"]

  api-gateway:
    build:
      context: ../account/api-gateway
    environment:
      OIDC_ISSUER: https://account-test.alive.org.tw
      JWKS_URL: http://account-api:8080/.well-known/jwks.json
      OIDC_METADATA_URL: http://account-api:8080/.well-known/openid-configuration
      OIDC_TEST_ISSUER: https://account-test.alive.org.tw
      TEST_JWKS_URL: http://account-api:8080/.well-known/jwks.json
      OIDC_TEST_METADATA_URL: http://account-api:8080/.well-known/openid-configuration
    volumes:
      - ./compose/gateway/fqdn.local.conf:/etc/nginx/conf.d/common/fqdn.conf:ro
    depends_on:
      account-api:
        condition: service_started
      hhc-web-api:
        condition: service_started
      asset-api:
        condition: service_started
    restart: unless-stopped
    expose: ["10000"]

volumes:
  office-postgres:
  office-redis:
  office-assets:
  office-caddy-data:
  office-caddy-config:

secrets:
  frontend_npmrc:
    file: ${FRONTEND_NPMRC_FILE:?set FRONTEND_NPMRC_FILE}
