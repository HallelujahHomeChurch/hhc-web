name: CI

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/../hhc-web-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: corepack enable
        working-directory: ${{ github.workspace }}
      # PR-only unpublished dependency proof. Main/release keeps exact registry installation.
      - name: Checkout immutable Shared candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HallelujahHomeChurch/frontend-platform
          ref: fab244007cfd85e24e7a25c1c38e805360c50788
          path: .candidate-shared
          persist-credentials: false
      - name: Build and pack immutable Shared candidate
        working-directory: ${{ github.workspace }}/.candidate-shared
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
          corepack pnpm check:packages
          corepack pnpm pack:packages
      - name: Test and prepare disposable candidate context
        working-directory: ${{ github.workspace }}
        run: |
          node --test scripts/prepare-shared-candidate.node-test.mjs
          node scripts/prepare-shared-candidate.mjs prepare .candidate-shared "$GITHUB_WORKSPACE/../hhc-web-candidate"
      - name: Generate coherent candidate lock
        run: corepack pnpm install --lockfile-only --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          echo "TRIVY_CACHE=$trivy_cache" >> "$GITHUB_ENV"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - run: corepack pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify installed immutable candidate bytes
        run: node scripts/prepare-shared-candidate.mjs verify .
      - name: Install existing font subset inspection tools
        run: |
          python3 -m venv "$RUNNER_TEMP/banner-font-tools"
          "$RUNNER_TEMP/banner-font-tools/bin/pip" install 'fonttools==4.60.2' 'Brotli==1.2.0'
          echo "$RUNNER_TEMP/banner-font-tools/bin" >> "$GITHUB_PATH"
      - run: GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$PWD" corepack pnpm test:run
      - run: corepack pnpm lint
      - run: corepack pnpm build
      - run: corepack pnpm perf:static
      - run: ./scripts/test-release-policy.sh
      - name: Build image
        run: |
          printf '@hallelujahhomechurch:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/npmrc"
          docker build --secret id=npmrc,src="$RUNNER_TEMP/npmrc" -t hhc-web:verify .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_CACHE:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 hhc-web:verify
