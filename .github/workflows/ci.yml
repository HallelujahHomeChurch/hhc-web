name: CI

on:
  pull_request:

permissions:
  contents: read
  packages: read

# Supersede only older verification of the same PR.
concurrency:
  group: hhc-web-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test documentation classification
        run: python3 .github/scripts/test-ci-agent-docs.py
      - name: Classify proven human documentation
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci-agent-docs.py "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: agent_docs
    if: ${{ always() && (needs.agent_docs.result != 'success' || needs.agent_docs.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - name: Test documentation classification
        run: node --test scripts/classify-ci-docs.node-test.mjs
      - name: Classify documentation-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/classify-ci-docs.mjs "$BASE_SHA" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: corepack enable
        if: steps.changes.outputs.docs_only != 'true'
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          echo "TRIVY_CACHE=$trivy_cache" >> "$GITHUB_ENV"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - run: corepack pnpm install --frozen-lockfile
        if: steps.changes.outputs.docs_only != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install existing font subset inspection tools
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/banner-font-tools"
          "$RUNNER_TEMP/banner-font-tools/bin/pip" install 'fonttools==4.60.2' 'Brotli==1.2.0'
          echo "$RUNNER_TEMP/banner-font-tools/bin" >> "$GITHUB_PATH"
      - run: corepack pnpm test:run
        if: steps.changes.outputs.docs_only != 'true'
      - run: corepack pnpm lint
        if: steps.changes.outputs.docs_only != 'true'
      - name: Build controlled live-load artifact
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          node scripts/build-public-live-load.mjs "$RUNNER_TEMP/public-live-load"
          cd "$RUNNER_TEMP/public-live-load"
          sha256sum public-live-load.js > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changes.outputs.docs_only != 'true'
        with:
          name: controlled-live-load-${{ github.sha }}
          path: |
            ${{ runner.temp }}/public-live-load/public-live-load.js
            ${{ runner.temp }}/public-live-load/SHA256SUMS
          if-no-files-found: error
          retention-days: 2
      - run: ./scripts/test-release-policy.sh
      - name: Build image
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          umask 077
          maps_dir=""
          map_container=""
          trap 'test -z "$map_container" || docker rm "$map_container" >/dev/null; test -z "$maps_dir" || rm -rf "$maps_dir"; rm -f "$RUNNER_TEMP/npmrc" "$RUNNER_TEMP/sentry-fixture"' EXIT
          printf '@hallelujahhomechurch:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/npmrc"
          # Noncredential fixture enables map generation; Docker build must never call Sentry.
          printf fixture-not-a-credential > "$RUNNER_TEMP/sentry-fixture"
          image_args=(--secret id=npmrc,src="$RUNNER_TEMP/npmrc"
            --secret id=sentry_auth_token,src="$RUNNER_TEMP/sentry-fixture"
            --build-arg SENTRY_ORG=fixture --build-arg SENTRY_PROJECT=fixture
            --build-arg NEXT_PUBLIC_SENTRY_RELEASE="$GITHUB_SHA")
          docker build "${image_args[@]}" --target runtime -t hhc-web:verify .
          docker run --rm --network none --read-only --memory 128m --cpus 1 --entrypoint /nodejs/bin/node hhc-web:verify /app/diagnose-dapr-port.mjs
          docker build "${image_args[@]}" --target source_maps -t hhc-web:sourcemaps-verify .
          maps_dir="$(mktemp -d "$RUNNER_TEMP/hhc-sourcemaps-test.XXXXXX")"
          map_container="$(docker create hhc-web:sourcemaps-verify /unused)"
          docker cp "$map_container:/." "$maps_dir"
          test -n "$(find "$maps_dir" -type f -name '*.map' -print -quit)"
          docker run --rm --entrypoint /nodejs/bin/node hhc-web:verify -e \
            'if(require("node:fs").readdirSync("/app",{recursive:true}).some(p=>p.endsWith(".map")))throw new Error("Source maps reached runtime")'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check static budgets on the verified image
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          docker run --rm --network none --read-only --memory 256m --cpus 1 \
            -v "$PWD/src:/app/src:ro" \
            -v "$PWD/scripts/check-static-budgets.mjs:/check-static-budgets.mjs:ro" \
            --entrypoint /nodejs/bin/node hhc-web:verify /check-static-budgets.mjs --require-build
      - name: Scan image
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_CACHE:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 hhc-web:verify
